<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title> SKILL STOPWATCH</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:radial-gradient(circle at top,#172554 0,#0b1020 42%,#050812 100%);
    color:#f8fafc;display:flex;align-items:center;justify-content:center;padding:24px;
  }
  .app{width:min(520px,100%);}
  .brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .brand h1{font-size:20px;letter-spacing:.08em}
  .badge{font-size:11px;padding:6px 10px;border:1px solid #334155;border-radius:999px;color:#94a3b8}
  .card{
    background:rgba(15,23,42,.78);border:1px solid rgba(148,163,184,.18);
    border-radius:28px;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.45);
    backdrop-filter:blur(18px);
  }
  .status{font-size:12px;text-transform:uppercase;letter-spacing:.18em;color:#64748b;text-align:center;margin-bottom:18px}
  .display{
    text-align:center;font-variant-numeric:tabular-nums;
    font-size:clamp(48px,13vw,76px);font-weight:700;letter-spacing:-.045em;
    margin:12px 0 30px;
  }
  .display span.ms{color:#38bdf8;font-size:.55em}
  .controls{display:grid;grid-template-columns:1fr 1.35fr 1fr;gap:10px}
  button{
    border:0;border-radius:16px;padding:14px 12px;font-weight:700;font-size:15px;
    color:#e2e8f0;background:#1e293b;cursor:pointer;transition:.18s transform,.18s background;
  }
  button:hover{transform:translateY(-2px);background:#334155}
  button:active{transform:scale(.98)}
  .primary{background:linear-gradient(135deg,#2563eb,#06b6d4);color:white}
  .primary:hover{background:linear-gradient(135deg,#1d4ed8,#0891b2)}
  button:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .laps{margin-top:24px;border-top:1px solid rgba(148,163,184,.14);padding-top:18px}
  .lap-head{display:flex;justify-content:space-between;color:#64748b;font-size:12px;margin-bottom:8px}
  .lap-list{max-height:210px;overflow:auto}
  .lap{
    display:flex;justify-content:space-between;padding:11px 4px;
    border-bottom:1px solid rgba(148,163,184,.09);font-variant-numeric:tabular-nums;
  }
  .empty{text-align:center;color:#475569;padding:22px 0;font-size:13px}
  .tip{text-align:center;color:#64748b;font-size:12px;margin-top:18px}
  @media(max-width:420px){.card{padding:22px}.controls{grid-template-columns:1fr 1fr}.controls .primary{grid-column:1/-1;grid-row:1}}
</style>
</head>
<body>
<main class="app">
  <div class="brand">
    <h1>SKILL STOPWATCH</h1>
    <span class="badge">SKILLCRAFT • TASK 03</span>
  </div>

  <section class="card" aria-label="Stopwatch">
    <div class="status" id="status">Ready</div>

    <div class="display" aria-live="polite">
      <span id="minutes">00</span>:<span id="seconds">00</span><span class="ms">.<span id="milliseconds">00</span></span>
    </div>

    <div class="controls">
      <button id="reset">Reset</button>
      <button id="start" class="primary">Start</button>
      <button id="lap" disabled>Lap</button>
    </div>

    <div class="laps">
      <div class="lap-head"><span>LAP HISTORY</span><span id="lapCount">0</span></div>
      <div class="lap-list" id="lapList">
        <div class="empty">No laps yet. Start the timer and record a lap.</div>
      </div>
    </div>
  </section>

  <div class="tip">Space: Start/Pause &nbsp; • &nbsp; R: Reset &nbsp; • &nbsp; L: Lap</div>
</main>

<script>
  let startTime = 0;
  let elapsed = 0;
  let timer = null;
  let laps = [];

  const $ = id => document.getElementById(id);
  const pad = n => String(n).padStart(2, "0");

  function format(ms) {
    const totalSeconds = Math.floor(ms / 1000);
    const minutes = Math.floor(totalSeconds / 60);
    const seconds = totalSeconds % 60;
    const milliseconds = Math.floor((ms % 1000) / 10);
    return { minutes, seconds, milliseconds };
  }

  function render() {
    const t = format(elapsed);
    $("minutes").textContent = pad(t.minutes);
    $("seconds").textContent = pad(t.seconds);
    $("milliseconds").textContent = pad(t.milliseconds);
  }

  function tick() {
    elapsed = performance.now() - startTime;
    render();
  }

  function start() {
    if (timer) return;
    startTime = performance.now() - elapsed;
    timer = setInterval(tick, 10);
    $("start").textContent = "Pause";
    $("status").textContent = "Running";
    $("lap").disabled = false;
  }

  function pause() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
    tick();
    $("start").textContent = "Start";
    $("status").textContent = "Paused";
  }

  function reset() {
    clearInterval(timer);
    timer = null;
    elapsed = 0;
    laps = [];
    render();
    renderLaps();
    $("start").textContent = "Start";
    $("status").textContent = "Ready";
    $("lap").disabled = true;
  }

  function toggleStart() {
    timer ? pause() : start();
  }

  function lap() {
    if (!timer) return;
    laps.unshift(elapsed);
    renderLaps();
  }

  function renderLaps() {
    $("lapCount").textContent = laps.length;
    if (!laps.length) {
      $("lapList").innerHTML = '<div class="empty">No laps yet. Start the timer and record a lap.</div>';
      return;
    }
    $("lapList").innerHTML = laps.map((ms, i) => {
      const t = format(ms);
      return `<div class="lap"><span>Lap ${laps.length - i}</span><strong>${pad(t.minutes)}:${pad(t.seconds)}.${pad(t.milliseconds)}</strong></div>`;
    }).join("");
  }

  $("start").addEventListener("click", toggleStart);
  $("reset").addEventListener("click", reset);
  $("lap").addEventListener("click", lap);

  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.code === "Space") { e.preventDefault(); toggleStart(); }
    if (e.key.toLowerCase() === "r") reset();
    if (e.key.toLowerCase() === "l" && timer) lap();
  });

  render();
</script>
</body>
</html>
